<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedir alteração · Vidalma</title>
<meta name="theme-color" content="#101418">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: 'Chivo'; font-weight: 100 900; font-display: swap; src: url('fontes/Chivo-variable-latin.woff2') format('woff2'); }
@font-face { font-family: 'DM Sans'; font-weight: 100 900; font-display: swap; src: url('fontes/DMSans-variable-latin.woff2') format('woff2'); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #E9EBEA; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-wrap: pretty; }
a { color: #101418; }
a:hover { color: #454C55; }
input, textarea, select { font: 400 16px 'DM Sans', system-ui, sans-serif; }
input:focus, textarea:focus, select:focus { outline: none; border-color: #101418; box-shadow: 0 0 0 3px #F2C230; }
button { font-family: 'Chivo', system-ui, sans-serif; }
::placeholder { color: #454C55; opacity: 1; }
</style>
</head>
<body>
<div data-screen-label="09 Nova solicitacao" style="width:100%;max-width:560px;margin:0 auto;min-height:100vh;background:#E9EBEA;box-sizing:border-box;display:flex;flex-direction:column">
<div style="height:64px;flex:none;background:#101418;display:flex;align-items:center;justify-content:space-between;padding:0 24px">
<svg viewBox="0 0 270 78" width="130" style="height:auto;display:block"><g transform="translate(0 3) scale(0.72)"><path d="M16 16H62V34H16Z" fill="#E9EBEA"></path><path d="M66 16H84V62H66Z" fill="#E9EBEA"></path><path d="M38 66H84V84H38Z" fill="#E9EBEA"></path><path d="M16 38H30L34 43V84H16Z" fill="#E9EBEA"></path></g><text x="90" y="56" font-family="Chivo" font-size="46" font-weight="700" letter-spacing="-0.4" fill="#E9EBEA">vidalma</text></svg>
<a href="entrar.html" style="min-height:44px;display:flex;align-items:center;font:500 15px 'DM Sans';color:#E9EBEA;text-decoration:none">Sair</a>
</div>
<div style="padding:24px;display:flex;flex-direction:column;gap:24px">
<a href="solicitacoes.html" style="min-height:44px;display:flex;align-items:center;font:400 16px 'DM Sans';color:#101418">Voltar</a>
<span style="font:800 32px/1.05 'Chivo';letter-spacing:-.025em;color:#101418">Pedir alteração</span>
<form id="form-nova" style="display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;gap:8px">
<label for="projeto" style="font:500 13px 'DM Sans';color:#101418">Qual projeto</label>
<select id="projeto" name="projeto" style="background:#FFFFFF;border:1.5px solid #454C55;border-radius:3px;padding:0 16px;font:400 16px 'DM Sans';color:#101418;width:100%;height:48px;appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\'><path d=\'M4 8H20L12 18Z\' fill=\'%23101418\'/></svg>');background-repeat:no-repeat;background-position:right 16px center;background-size:16px">
</select>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label for="titulo" style="font:500 13px 'DM Sans';color:#101418">O que você precisa</label>
<input id="titulo" name="titulo" type="text" required placeholder="Trocar a foto da primeira tela" style="background:#FFFFFF;border:1.5px solid #454C55;border-radius:3px;padding:0 16px;font:400 16px 'DM Sans';color:#101418;width:100%;height:48px">
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label for="detalhes" style="font:500 13px 'DM Sans';color:#101418">Conta com detalhes</label>
<textarea id="detalhes" name="detalhes" rows="5" placeholder="Escreve do seu jeito. Se tiver foto nova, me manda depois no direct." style="background:#FFFFFF;border:1.5px solid #454C55;border-radius:3px;padding:13px 16px;font:400 16px/1.55 'DM Sans';color:#101418;width:100%;resize:vertical;min-height:120px"></textarea>
</div>
<button type="submit" style="height:48px;background:#F2C230;border:0;border-radius:3px;width:100%;font:700 16px 'Chivo';color:#101418;cursor:pointer">Enviar pedido</button>
</form>
<p id="nota" style="font:400 14px/1.55 'DM Sans';color:#454C55;margin:0">Eu respondo com prazo e, se for fora do combinado, com preço. Antes de começar.</p>
</div>
</div>
<script defer src="supabase.js"></script>
<script defer src="config.js"></script>
<script defer src="app.js"></script>
</body>
</html>
